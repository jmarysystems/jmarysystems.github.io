<script>
(function () {
    const canvas = document.getElementById('matrixTopo');
    const ctx = canvas.getContext('2d');

    const caracteres = '01';
    const tamanhoFonte = 16;
    let colunas, gotas;

    function ajustarTamanho() {
        const pai = canvas.parentElement;
        canvas.width = pai.offsetWidth;
        canvas.height = pai.offsetHeight;
        colunas = Math.floor(canvas.width / tamanhoFonte);
        gotas = [];
        for (let i = 0; i < colunas; i++) {
            gotas[i] = Math.random() * -canvas.height / tamanhoFonte;
        }
    }


    const DURACAO_QUEDA = 100;  // tempo caindo (8 segundos)
    const TEMPO_PAUSA   = 300;  // pausa de 2 segundos

    let fimDaQueda = performance.now() + DURACAO_QUEDA;
    let fimDaPausa = 0;

    function desenhar() {
        const agora = performance.now();

        if (fimDaPausa === 0 && agora >= fimDaQueda) {
            fimDaPausa = agora + TEMPO_PAUSA; // inicia a pausa de 2s
        }

        if (fimDaPausa > 0 && agora >= fimDaPausa) {
            // pausa terminou: volta a cair por mais 8s
            fimDaPausa = 0;
            fimDaQueda = agora + DURACAO_QUEDA;
        }

        if (fimDaPausa === 0) {
            // só desenha quando não está pausado
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00FF41';
            ctx.font = tamanhoFonte + 'px monospace';

            for (let i = 0; i < colunas; i++) {
                let novaPosicao = gotas[i] + 0.3;

                if (novaPosicao * tamanhoFonte > canvas.height) {
                    novaPosicao = 0;
                }

                if (Math.floor(novaPosicao) !== Math.floor(gotas[i]) || novaPosicao === 0) {
                    const caractere = caracteres.charAt(Math.floor(Math.random() * caracteres.length));
                    ctx.fillText(caractere, i * tamanhoFonte, novaPosicao * tamanhoFonte);
                }

                gotas[i] = novaPosicao;
            }
        }

        requestAnimationFrame(desenhar);
    }
    
    

    window.addEventListener('resize', ajustarTamanho);
    ajustarTamanho();
    desenhar();
})();
</script>
